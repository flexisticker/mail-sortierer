name: Docker-Image

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
  # Wöchentliche Sicherheitsprüfung (Montag 6 Uhr MEZ) mit den neuesten Lücken-Datenbanken – baut nichts,
  # meldet nur (GitHub schickt bei Fehlschlag eine Mail an den Repo-Inhaber)
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  # Geheimnisse dürfen nie im Repository stehen – Fund stoppt den Build
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Geheimnisse suchen (gitleaks, gesamte Historie)
        env:
          GITLEAKS: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS" git --redact --no-banner --verbose --exit-code 1 /repo
      - name: Angriffsschutz prüfen (keine Fehlalarme, Fallen greifen)
        run: node scripts/shield-check.mjs

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax prüfen
        run: for f in src/*.js; do node --check "$f"; done
      # Basisimage node:22-slim mit Trivy (per Digest gepinnt; die trivy-action wurde 2026 kompromittiert, darum keine Action):
      # hoch/kritisch nur Bericht, kritisch mit verfügbarer Korrektur = Abbruch
      - name: Basisimage node:22-slim scannen (Trivy)
        env:
          TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        run: |
          docker pull -q node:22-slim
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 0 node:22-slim
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 node:22-slim

  build:
    needs: [secrets, security]
    if: ${{ github.event_name != 'schedule' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mail-sortierer
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            de.flexisticker.version=${{ steps.ver.outputs.version }}
            de.flexisticker.build=${{ github.run_number }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Windows-Setup (Inno Setup + WinSW-Dienst), gebaut und still getestet auf windows-latest
  windows:
    needs: [secrets, security]
    if: ${{ github.event_name != 'schedule' && !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: Setup bauen
        shell: pwsh
        run: ./windows/build.ps1 -Build "${{ github.run_number }}" -Commit "${{ github.sha }}"
      - name: Setup testen
        shell: pwsh
        run: ./windows/test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist-windows/*.exe
          retention-days: 14

  # Setup als OCI-Artefakt ins (öffentliche) Paket mail-sortierer, Tag „windows“ – die Vedly-Zentrale gibt es von dort an Firmen mit Lizenz weiter
  windows-publish:
    needs: windows
    if: ${{ github.event_name != 'schedule' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: dist-windows
      - uses: oras-project/setup-oras@v1
      - name: Nach ghcr.io hochladen
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          version=$(node -p "require('./package.json').version")
          repo="ghcr.io/${{ github.repository_owner }}/mail-sortierer"
          if [ "${{ github.ref_name }}" = "main" ]; then tag="windows"; else tag="windows-$(echo '${{ github.ref_name }}' | tr '/' '-')"; fi
          cd dist-windows
          file=$(ls Mail-Sortierer-Setup-*.exe | head -n1)
          oras push "$repo:$tag" \
            --artifact-type application/vnd.mail-sortierer.windows-setup \
            --annotation "org.opencontainers.image.version=$version" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            "$file:application/vnd.microsoft.portable-executable"
